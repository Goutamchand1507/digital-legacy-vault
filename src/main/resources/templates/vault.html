<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vault · LegacyVault</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><div th:replace="~{fragments :: nav}"></div><main class="wrap"><h1>My Digital Vault</h1><p th:if="${param.added}" class="ok">Item saved.</p><p th:if="${param.deleted}" class="ok">Item deleted.</p><p th:if="${error}" class="err" th:text="${error}"></p><div class="grid"><section class="card"><h2>Add item</h2><form th:action="@{/vault}" method="post"><label>Title</label><input name="title" maxlength="150" required><label>Category</label><select name="category"><option>Personal note</option><option>Family instructions</option><option>Digital assets</option><option>Important document</option><option>Other</option></select><label>Content</label><textarea name="content" rows="5" required></textarea><label><input type="checkbox" name="releaseAuthorized" value="true"> Intended for possible legacy release</label><p class="hint">Preference only; automated release is not implemented.</p><button>Save item</button></form></section><section><article class="card" th:each="item : ${items}"><h2 th:text="${item.title}">Title</h2><p class="tag" th:text="${item.category}">Category</p><p class="content" th:text="${item.content}">Content</p><p class="hint" th:text="${item.releaseAuthorized}?'Release preference: yes':'Release preference: no'"></p><form th:action="@{/vault/{id}/delete(id=${item.id})}" method="post" onsubmit="return confirm('Delete this item?')"><button class="danger">Delete</button></form></article><article class="card" th:if="${#lists.isEmpty(items)}">Your vault is empty. Add your first item.</article></section></div></main></body></html>
