<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contacts · LegacyVault</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><div th:replace="~{fragments :: nav}"></div><main class="wrap"><h1>Trusted Contacts</h1><p th:if="${param.added}" class="ok">Contact saved.</p><p th:if="${param.deleted}" class="ok">Contact removed.</p><p th:if="${error}" class="err" th:text="${error}"></p><div class="grid"><section class="card"><h2>Add contact</h2><form th:action="@{/contacts}" method="post"><label>Name</label><input name="name" required><label>Email</label><input name="email" type="email" required><button>Save contact</button></form></section><section><article class="card" th:each="c : ${contacts}"><h2 th:text="${c.name}">Name</h2><p th:text="${c.email}">Email</p><form th:action="@{/contacts/{id}/delete(id=${c.id})}" method="post"><button class="danger">Remove</button></form></article><article class="card" th:if="${#lists.isEmpty(contacts)}">No contacts added yet.</article></section></div><p class="notice">Contact verification and notifications are not implemented in this student demo.</p></main></body></html>
