<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register · LegacyVault</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body class="auth"><main class="card"><h1>Create your vault</h1><p th:if="${error}" class="err" th:text="${error}"></p><form th:action="@{/register}" method="post"><label>Full name</label><input name="fullName" required minlength="2"><label>Email</label><input name="email" type="email" required><label>Password (8+ characters)</label><input name="password" type="password" minlength="8" required><label>Confirm password</label><input name="confirmPassword" type="password" minlength="8" required><button>Create account</button></form><p>Already registered? <a href="/login">Sign in</a></p></main></body></html>
