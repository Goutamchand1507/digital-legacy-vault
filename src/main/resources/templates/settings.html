<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Switch settings · LegacyVault</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><div th:replace="~{fragments :: nav}"></div><main class="wrap narrow"><h1>Dead-Man's Switch Settings</h1><p th:if="${param.saved}" class="ok">Settings saved; timer reset.</p><p th:if="${error}" class="err" th:text="${error}"></p><section class="card"><form th:action="@{/settings}" method="post"><label>Check-in interval (days, 1–365)</label><input type="number" name="intervalDays" min="1" max="365" required th:value="${user.checkInIntervalDays}"><label>Grace period (hours, 1–720)</label><input type="number" name="gracePeriodHours" min="1" max="720" required th:value="${user.gracePeriodHours}"><label><input type="checkbox" name="enabled" value="true" th:checked="${user.switchEnabled}"> Enable monitoring</label><p class="hint">Scheduler checks every minute and logs a demo reminder when overdue. It does not send email or release data.</p><button>Save settings</button></form></section><p class="notice">Inactivity is not proof of death or consent. This app never automatically releases vault contents.</p></main></body></html>
