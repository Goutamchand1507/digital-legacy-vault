
spring.application.name=digital-legacy-vault
server.port=8080

spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/digital_legacy_vault?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.thymeleaf.cache=false
server.servlet.session.persistent=false
